# Phase 1: 让 rk_gate 依赖本地零转码中继
#
# ★ 为什么是 Wants 而不是 Requires:
#   Requires 的话, 中继崩了会把 rk-gate 一起停掉; 而 rk-gate 是
#   Restart=on-failure —— "被依赖停掉"不算失败, 不会自己起来,
#   结果就是中继回来了、业务却还躺着。
#   现在只声明顺序(After), 中继崩了由看门狗按 L1/L2 判定后重启业务:
#     实测: kill -9 中继 -> systemd 5 秒拉起中继 -> 看门狗 122 秒后
#     判定业务线程卡死 -> 重启 rk-gate -> 4 路自动重新连上中继。
[Unit]
Wants=rk-gate-fanout.service
After=rk-gate-fanout.service
